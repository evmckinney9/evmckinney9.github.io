# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Evan McKinney
lang: en-US
repository: evmckinney9/evmckinney9.github.io
description: >-
  Evan McKinney — postdoctoral researcher at Yale, working on quantum
  computer architecture, compilers, and superconducting hardware.
baseurl: ""
url: "https://evm9.dev"
google_analytics: G-0S6658MQKV

# Build settings
plugins:
  - jekyll-seo-tag

# Front Matter Defaults
# https://jekyllrb.com/docs/configuration/front-matter-defaults/
defaults:
  - scope:
      path: ""
    values:
      author: Evan McKinney
      image: /assets/img/share_banner.jpg

