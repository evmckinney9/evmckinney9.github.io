bio: |
  I work at the intersection of computer architecture and superconducting
  quantum hardware, designing compilers and instruction sets that bridge the
  gap between abstract quantum algorithms and real physical devices, including
  contributions to the open-source Qiskit compiler stack as a
  [Qiskit Advocate](https://qiskit.org/advocates/).
  I collaborate with [Yongshan Ding](https://www.yongshanding.com/) in Computer
  Science and [Robert Schoelkopf](https://rsl.yale.edu/) in Applied Physics.
  Previously, I earned my PhD at the University of Pittsburgh, co-advised by
  [Alex K. Jones](https://www.alex-k-jones.org/) and
  [Michael Hatridge](https://hatlab.yale.edu/), and undergraduate degrees in
  Computer Engineering and Physics from Iowa State University.

interests:
  - "Quantum circuit synthesis and compiler co-design"
  - "Superconducting qubit architectures and instruction sets"
  - "Error correction for near-term and fault-tolerant devices"

